name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find project
        run: |
          if [ -f MusicHub.zip ]; then unzip -oq MusicHub.zip; fi
          if [ -d MusicHub ]; then echo "DIR=MusicHub" >> $GITHUB_ENV; else echo "DIR=." >> $GITHUB_ENV; fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build
        run: gradle assembleDebug --no-daemon
        working-directory: ${{ env.DIR }}
      - uses: actions/upload-artifact@v4
        with:
          name: MusicHub-apk
          path: ${{ env.DIR }}/app/build/outputs/apk/debug/app-debug.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          files: ${{ env.DIR }}/app/build/outputs/apk/debug/app-debug.apk
